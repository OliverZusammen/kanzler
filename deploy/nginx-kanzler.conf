# nginx-Konfiguration für kanzler.stache-advisory.online (Ploi: Site → Manage → Edit NGINX configuration)
# Plois Laravel-Vorlage ersetzen. Danach "Test configuration" und nginx unter Services neu laden.
server {
    listen 80;
    listen [::]:80;
    server_name kanzler.stache-advisory.online;
    # Ploi ergänzt hier nach dem SSL-Schritt listen 443 ssl + Zertifikate; diese Zeilen stehen lassen.

    root /home/ploi/kanzler.stache-advisory.online/public;
    index index.html;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # App-Seite nie cachen, sonst zeigen Handys tagelang alte Versionen
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Bilder dürfen gecacht werden
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Einzige PHP-Datei
    location = /api.php {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/api.php;
    }
    location ~ \.php$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\.(?!well-known).* { deny all; }
    access_log off;
    error_log /var/log/nginx/kanzler.stache-advisory.online-error.log error;
}
